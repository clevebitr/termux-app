plugins {
    id "com.android.library"
}

// 终端核心复制基线。
// 说明：本模块由 terminal-emulator 与 terminal-view 复制而来，包名迁移为
// com.termux.shell.terminal 与 com.termux.shell.termview，用于在不修改旧模块的前提下承载
// 脏行增量、同步输出与键序协议等 VT 层改动。依据见 docs/DELIVERY_PLAN.md 决策点 D1。
// 约束：本模块不得依赖 :terminal-emulator、:terminal-view，否则将出现重复类与重复原生库。

android {
    // R 类归属 termview 包，因为资源由 terminal-view 迁移而来。
    namespace "com.termux.shell.termview"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        minSdkVersion 24

        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // 单元测试依赖 android.graphics 与 android.view 的常量与桩实现，故启用默认返回值。
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"

    testImplementation "junit:junit:4.13.2"
}
