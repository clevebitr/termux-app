plugins {
    id "com.android.application"
}

// Kotlin 与 Compose 编译器插件由根构建脚本的 buildscript 类路径提供，此处仅应用。
apply plugin: "kotlin-android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

// 新外壳的 targetSdk。默认取 28，原因见 docs/UPGRADE.md 第 6 节：exec 与 W^X 约束。
// 通过 -PappNewTargetSdk=36 可切换为现代外壳形态，须配合运行时拆分启用。
def appNewTargetSdk = (rootProject.findProperty("appNewTargetSdk") ?: "28").toInteger();

// Compose 与 Kotlin 工具链版本。两者必须与根构建脚本声明的 Kotlin 插件版本一致。
def composeBomVersion = "2025.10.01"
def activityComposeVersion = "1.10.1"

android {
    namespace "com.termux.shell"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        applicationId "com.termux.shell"
        // 新外壳的 minSdk 高于旧模块：旧模块的 21 已无实际收益，仅保留兼容分支。
        minSdkVersion 24
        targetSdkVersion appNewTargetSdk
        versionCode 1
        versionName "0.1.0"
    }

    // 演示包统一使用旧模块自带的公开测试密钥（testkey），使 debug 与 release 包、
    // 以及不同 CI 运行之间的产物使用同一证书，可以直接覆盖安装。该密钥是公开的，
    // 仅用于测试与演示，不用于发布。
    signingConfigs {
        demo {
            storeFile rootProject.file("app/testkey_untrusted.jks")
            storePassword "xrj45yWGLbsO7W0v"
            keyAlias "alias"
            keyPassword "xrj45yWGLbsO7W0v"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.demo
        }
        release {
            signingConfig signingConfigs.demo
            // 性能验证包：开启 R8 代码压缩与资源裁剪，减少 Compose/terminal-core 的体积与加载开销。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    lint {
        abortOnError true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // 终端核心复制基线。不得同时依赖 :terminal-emulator 与 :terminal-view，否则出现重复类与重复原生库。
    implementation project(":terminal-core")

    // Compose 版本由 BOM 统一管理，各库不再单独声明版本。
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.activity:activity-compose:$activityComposeVersion"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.9.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    debugImplementation "androidx.compose.ui:ui-tooling"

    testImplementation "junit:junit:4.13.2"
    // 平台 android.jar 中的 org.json 为抛出异常的存根，单元测试需要可用的实现。
    testImplementation "org.json:json:20240303"
}
